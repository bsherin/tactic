services:
  tactic_host1:
    environment:
      - MY_ID=host5000
      - MYPORT=5000
      - USE_DEVELOPMENT_BUNDLES=${USE_DEVELOPMENT_BUNDLES}
      - RUNNING_ON_AWS=${RUNNING_ON_AWS}
      - USE_GEVENT=True
      - LOG_LEVEL=DEBUG
      - PYCHARM_DEBUG=1
  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/loki.yml
    labels:
      project: tactic_aux
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - tactic-net

  alloy:
    image: grafana/alloy:v1.12.1
    command: >
      run --server.http.listen-addr=0.0.0.0:12345
          --storage.path=/var/lib/alloy/data
          /etc/alloy/config.alloy
    labels:
      project: tactic_aux
    ports:
      - "12345:12345"   # optional: Alloy debug UI
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - tactic-net

  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "127.0.0.1:3000:3000"
    labels:
      project: tactic_aux
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - tactic-net


  tactic-redis:
    image: redis:alpine
    restart: always
    labels:
      project: tactic_aux
    hostname: tactic-redis
    container_name: tactic-redis
    networks:
      - tactic-net
    ports:
      - "6379:6379"
    environment:
      - MY_ID=tactic-redis
      - OWNER=host
    command: [ "redis-server", "--appendonly", "yes", "--appendfilename", "appendonly.aof", "--dir", "/data" ]
    volumes:
      - tactic-redis-data:/data

  megaplex:
    image: rabbitmq:3.12-management
    labels:
      project: tactic_aux
    depends_on:
      - tactic-redis
    restart: always
    hostname: megaplex
    container_name: megaplex
    networks:
      - tactic-net
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - MY_ID=megaplex
      - OWNER=host

  tactic_pool_watcher_s3:
    image: bsherin/tactic-pool-watcher-s3:${IMG_SUFFIX}
    build:
      context: .
      dockerfile: Dockerfile-pool-watcher-s3
      args:
        BASE_IMAGE: ${BASE_IMAGE}
    restart: always
    container_name: pool_watcher_s3
    init: true
    platform: ${PLATFORM}
    labels:
      project: tactic
      my_id: pool_watcher_s3
      owner: host
      parent: host
      other_name: pool_watcher_s3
    environment:
      - RUNNING_ON_AWS=${RUNNING_ON_AWS}
    networks:
      - tactic-net

  tactic_main:
    build:
      context: .
      dockerfile: Dockerfile-main
      args:
        BASE_IMAGE: ${BASE_IMAGE}
    image: bsherin/tactic-main:${IMG_SUFFIX}
    platform: ${PLATFORM}
    labels:
      project: tactic
      my_id: main_service
      owner: host
      parent: host
      other_name: main_service
    environment:
      - USE_GEVENT=False
      - DEBUG=${DEBUG}
      - LOG_LEVEL=DEBUG
      - RUNNING_ON_AWS=${RUNNING_ON_AWS}
    volumes:
      - type: bind
        source: "/var/run/docker.sock"
        target: "/var/run/docker.sock"
    networks:
      - tactic-net

  tactic_module_viewer:
    build:
      context: .
      dockerfile: Dockerfile-module-viewer
      args:
        BASE_IMAGE: ${BASE_IMAGE}
    platform: ${PLATFORM}
    labels:
      project: tactic
      my_id: module_viewer
      owner: host
      parent: host
      other_name: module_viewer
    image: bsherin/tactic-module-viewer:${IMG_SUFFIX}
    environment:
      - PYTHONUNBUFFERED=0
      - OWNER=host
      - PARENT=host
      - USE_GEVENT=False
      - RUNNING_ON_AWS=${RUNNING_ON_AWS}
    networks:
      - tactic-net

volumes:
  alloy-data:
  grafana-data:
  loki-data: